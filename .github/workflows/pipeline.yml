name: Pipeline El Rincón del Café

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']
  workflow_dispatch:
    inputs:
      grep:
        description: 'Filtro --grep de Playwright (vacío = @acceptanceTest)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  pruebas-aceptacion:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            pruebas/package-lock.json

      - name: Instalar la app
        working-directory: app
        run: npm ci

      - name: Instalar pruebas y Chromium
        working-directory: pruebas
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # webServer (playwright.config.js) enciende la app antes de probar
      - name: Ejecutar pruebas @acceptanceTest
        working-directory: pruebas
        run: |
          grep='${{ github.event.inputs.grep }}'
          npx playwright test --grep "${grep:-@acceptanceTest}"

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pruebas/playwright-report

  # Simulado: en este ejercicio no se despliega a Render.
  # needs + if: solo corre si las pruebas pasaron y el evento es un push a main.
  desplegar-produccion:
    needs: pruebas-aceptacion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar (simulado)
        run: echo "Pruebas de aceptación OK. Aquí se llamaría al deploy hook de Render (secreto RENDER_DEPLOY_HOOK)."
