<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Rincón del Café</title>
  <style>
    :root {
      --cafe-oscuro: #4a2c17;
      --cafe-medio: #8b5a2b;
      --crema: #faf6f0;
      --arena: #eadbc8;
      --texto: #2b1d12;
      --exito: #2d6a2d;
      --error: #a4161a;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: var(--crema);
      color: var(--texto);
      line-height: 1.5;
    }
    header {
      background: var(--cafe-oscuro);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    header strong { font-size: 1.2rem; letter-spacing: 0.02em; }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 20px;
      background: var(--arena);
      border-bottom: 1px solid #d6c3a8;
    }
    main { padding: 20px; max-width: 760px; margin: 0 auto; }
    section {
      background: #fff;
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 2px 8px rgba(74, 44, 23, 0.08);
    }
    h2 {
      margin: 0 0 14px;
      color: var(--cafe-oscuro);
      font-size: 1.4rem;
      border-bottom: 2px solid var(--arena);
      padding-bottom: 8px;
    }
    h3 { color: var(--cafe-medio); margin: 18px 0 8px; font-size: 1.05rem; }
    form { display: grid; gap: 12px; margin-bottom: 14px; }
    label { display: grid; gap: 4px; font-weight: 600; font-size: 0.95rem; }
    input, select, textarea {
      padding: 8px 10px;
      border: 1px solid #cdb9a0;
      border-radius: 8px;
      font: inherit;
      background: #fffdf9;
    }
    input:focus, select:focus, textarea:focus, button:focus-visible {
      outline: 3px solid #f0c27b;
      outline-offset: 1px;
    }
    button {
      padding: 9px 14px;
      border: none;
      border-radius: 8px;
      background: var(--cafe-medio);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      justify-self: start;
    }
    button:hover { background: var(--cafe-oscuro); }
    nav button {
      background: #fff;
      color: var(--cafe-oscuro);
      border: 1px solid #cdb9a0;
      padding: 6px 12px;
      font-weight: 500;
      justify-self: auto;
    }
    nav button:hover { background: var(--cafe-oscuro); color: #fff; }
    #salir {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    #salir:hover { background: rgba(255, 255, 255, 0.15); }
    #mensaje { min-height: 1.4em; margin: 12px 0 0; font-weight: 600; }
    #mensaje[data-tipo="error"] { color: var(--error); }
    #mensaje[data-tipo="ok"] { color: var(--exito); }
    ul { padding-left: 0; list-style: none; margin: 0; }
    ul li {
      background: var(--crema);
      border: 1px solid #ecdfcd;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    p { margin: 6px 0; }
    strong[data-testid] { color: var(--cafe-oscuro); }
    @media (max-width: 480px) {
      main { padding: 12px; }
      section { padding: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <strong>☕ El Rincón del Café</strong>
    <button id="salir" type="button" hidden>Cerrar sesión</button>
  </header>
  <nav id="nav" hidden></nav>
  <main id="app"></main>
  <script src="app.js"></script>
</body>
</html>
